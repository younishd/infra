apiVersion: v1
kind: Service
metadata:
  name: docmost
  namespace: docmost
  annotations:
    service.cilium.io/global: "true"
    service.cilium.io/shared: "false"
    service.cilium.io/global-sync-endpoint-slices: "true"
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 3000
