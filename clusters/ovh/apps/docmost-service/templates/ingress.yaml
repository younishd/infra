apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docmost
  namespace: docmost
  annotations:
    cert-manager.io/cluster-issuer: "{{ .Values.ingress.clusterIssuer.public }}"
spec:
  ingressClassName: traefik-public
  rules:
  - host: "kb.{{ .Values.ingress.baseDomain }}"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: docmost
            port:
              number: 80
  tls:
  - hosts: [ "kb.{{ .Values.ingress.baseDomain }}" ]
    secretName: docmost-tls
