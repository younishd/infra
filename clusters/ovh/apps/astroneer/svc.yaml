apiVersion: v1
kind: Service
metadata:
  name: astroneer
  annotations:
    lbipam.cilium.io/ips: "51.91.62.140"
    lbipam.cilium.io/sharing-key: ovh-public
    lbipam.cilium.io/sharing-cross-namespace: traefik
  labels:
    lb-pool: public
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    app: astroneer
  ports:
  - name: game
    port: 7777
    targetPort: game
    protocol: UDP
