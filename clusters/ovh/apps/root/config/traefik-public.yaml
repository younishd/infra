deployment:
  replicas: 2

ingressClass:
  enabled: true
  name: traefik-public
  isDefaultClass: false

providers:
  kubernetesIngress:
    ingressClass: traefik-public
    publishedService:
      enabled: true
  kubernetesCRD:
    ingressClass: traefik-public

service:
  type: LoadBalancer
  labels:
    lb-pool: public
  annotations:
    lbipam.cilium.io/ips: "51.91.62.140"
    lbipam.cilium.io/sharing-key: ovh-public
    lbipam.cilium.io/sharing-cross-namespace: astroneer
  spec:
    externalTrafficPolicy: Cluster
    allocateLoadBalancerNodePorts: false
