apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "{{ .Values.destination.name }}-docmost-service"
  namespace: argo-cd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: "{{ .Values.source.repoURL }}"
    targetRevision: "{{ .Values.source.targetRevision }}"
    path: "clusters/{{ .Values.destination.name }}/apps/docmost-service"
    helm:
      valuesObject:
        ingress:
          baseDomain: "{{ .Values.ingress.baseDomain }}"
          clusterIssuer:
            public: "{{ .Values.ingress.clusterIssuer.public }}"
  destination:
    name: "{{ .Values.destination.name }}"
    namespace: docmost
  syncPolicy:
    automated:
      prune: true
      allowEmpty: false
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
