apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: plex
  namespace: argo-cd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: "{{ .Values.source.repoURL }}"
      targetRevision: "{{ .Values.source.targetRevision }}"
      path: clusters/home/apps/plex
    - chart: plex-media-server
      repoURL: https://raw.githubusercontent.com/plexinc/pms-docker/gh-pages
      targetRevision: "1.*"
      helm:
        releaseName: plex
        values: |
          {{- tpl (.Files.Get "config/plex.yaml") . | nindent 10 }}
  destination:
    server: "{{ .Values.destination.server }}"
    namespace: plex
  syncPolicy:
    automated:
      prune: false
      allowEmpty: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
