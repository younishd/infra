---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: cilium-mesh-ca
spec:
  ca:
    secretName: cilium-mesh-ca
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: cilium-mesh-ca
  namespace: kube-system
spec:
  encryptedData:
    tls.crt: 
    tls.key: 
  template:
    metadata:
      name: cilium-mesh-ca
      namespace: kube-system
    type: kubernetes.io/tls
