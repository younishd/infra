apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "{{ .Values.destination.name }}-llm"
  namespace: argo-cd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
  - repoURL: "{{ .Values.source.repoURL }}"
    targetRevision: "{{ .Values.source.targetRevision }}"
    path: "clusters/{{ .Values.destination.name }}/apps/llm"
  - repoURL: https://helm.openwebui.com
    chart: open-webui
    targetRevision: "18.*"
    helm:
      releaseName: open-webui
      values: |
        {{- tpl (.Files.Get "config/open-webui.yaml") . | nindent 8 }}
  destination:
    name: "{{ .Values.destination.name }}"
    namespace: llm
  syncPolicy:
    automated:
      prune: true
      allowEmpty: false
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
