apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "{{ .Values.destination.name }}-docmost"
  namespace: argo-cd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
  - repoURL: "{{ .Values.source.repoURL }}"
    targetRevision: "{{ .Values.source.targetRevision }}"
    path: "clusters/{{ .Values.destination.name }}/apps/docmost"
  # - chart: docmost
  #   repoURL: https://repo.helmforge.dev
  #   targetRevision:
  #   helm:
  #     releaseName: docmost
  #     values: |
  #       {{- tpl (.Files.Get "config/docmost.yaml") . | nindent 8 }}
  destination:
    name: "{{ .Values.destination.name }}"
    namespace: docmost
  syncPolicy:
    automated:
      prune: false
      allowEmpty: false
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
