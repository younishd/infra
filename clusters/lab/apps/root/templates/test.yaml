apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "{{ .Values.destination.name }}-test"
  namespace: argo-cd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: "{{ .Values.source.repoURL }}"
    targetRevision: "{{ .Values.source.targetRevision }}"
    path: "clusters/{{ .Values.destination.name }}/apps/root/templates/test.yaml"
  destination:
    name: "{{ .Values.destination.name }}"
    namespace: default
  syncPolicy:
    automated:
      prune: false
      allowEmpty: false
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
