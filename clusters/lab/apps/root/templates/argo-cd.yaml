apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "{{ .Values.destination.name }}-argo-cd"
  namespace: argo-cd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
  - chart: argo-cd
    repoURL: https://argoproj.github.io/argo-helm
    targetRevision: "10.*"
    helm:
      releaseName: argo-cd
      values: |
        {{- tpl (.Files.Get "config/argo-cd.yaml") . | nindent 8 }}
  - repoURL: "{{ .Values.source.repoURL }}"
    targetRevision: "{{ .Values.source.targetRevision }}"
    path: "clusters/{{ .Values.destination.name }}/apps/argo-cd-resources"
  destination:
    name: "{{ .Values.destination.name }}"
    namespace: argo-cd
  syncPolicy:
    automated:
      prune: true
      allowEmpty: false
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
