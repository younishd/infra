apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "{{ .Values.destination.name }}-zalando-postgres-operator"
  namespace: argo-cd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: postgres-operator
    repoURL: https://opensource.zalando.com/postgres-operator/charts/postgres-operator
    targetRevision: "2.*"
    helm:
      releaseName: postgres-operator
      values: |
        {{- tpl (.Files.Get "config/zalando-postgres-operator.yaml") . | nindent 8 }}
  destination:
    name: "{{ .Values.destination.name }}"
    namespace: postgres
  syncPolicy:
    automated:
      prune: true
      allowEmpty: false
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
