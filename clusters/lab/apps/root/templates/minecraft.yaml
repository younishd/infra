apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "{{ .Values.destination.name }}-minecraft"
  namespace: argo-cd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
  - chart: minecraft
    repoURL: https://itzg.github.io/minecraft-server-charts
    targetRevision: "5.*"
    helm:
      releaseName: minecraft
      values: |
        {{- tpl (.Files.Get "config/minecraft.yaml") . | nindent 8 }}
  - repoURL: "{{ .Values.source.repoURL }}"
    targetRevision: "{{ .Values.source.targetRevision }}"
    path: "clusters/{{ .Values.destination.name }}/apps/minecraft-resources"
  destination:
    name: "{{ .Values.destination.name }}"
    namespace: minecraft
  syncPolicy:
    automated:
      prune: true
      allowEmpty: false
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
