clusterName: ceph-at-home

cephImage:
  repository: quay.io/ceph/ceph
  tag: v20

toolbox:
  enabled: true

cephClusterSpec:
  mon:
    count: 3
  mgr:
    count: 2
  dashboard:
    enabled: true
    ssl: false
  storage:
    useAllNodes: false
    useAllDevices: false
    nodes: {{ .Values.ceph.nodes | toJson }}

ingress:
  dashboard:
    annotations:
      cert-manager.io/cluster-issuer: "{{ .Values.ingress.clusterIssuer.internal }}"
    host:
      name: "ceph.{{ .Values.ingress.baseDomain }}"
      path: /
      pathType: Prefix
    tls:
    - hosts:
      - "ceph.{{ .Values.ingress.baseDomain }}"
      secretName: ceph-dashboard-tls

cephBlockPools:
- name: ceph-blockpool
  spec:
    failureDomain: host
    replicated:
      size: 3
    parameters:
      pg_num: "32"
      pgp_num: "32"
  storageClass:
    enabled: true
    name: general
    annotations: {}
    labels: {}
    isDefault: true
    reclaimPolicy: Retain
    allowVolumeExpansion: true
    volumeBindingMode: Immediate
    mountOptions: []
    allowedTopologies: []
    parameters:
      imageFormat: "2"
      imageFeatures: layering
      csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
      csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
      csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
      csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
      csi.storage.k8s.io/controller-publish-secret-name: rook-csi-rbd-provisioner
      csi.storage.k8s.io/controller-publish-secret-namespace: rook-ceph
      csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
      csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
      csi.storage.k8s.io/fstype: ext4

cephObjectStores:
- name: ceph-objectstore
  spec:
    metadataPool:
      failureDomain: host
      replicated:
        size: 3
    dataPool:
      failureDomain: host
      replicated:
        size: 3
    preservePoolsOnDelete: true
    gateway:
      port: 80
      instances: 1
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi
  storageClass:
    enabled: true
    name: ceph-bucket
    reclaimPolicy: Retain
    volumeBindingMode: Immediate
    parameters:
      region: de-ka-1
  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: "{{ .Values.ingress.clusterIssuer.internal }}"
    host:
      name: "s3.{{ .Values.ingress.baseDomain }}"
      path: /
      pathType: Prefix
    tls:
    - hosts: [ "s3.{{ .Values.ingress.baseDomain }}" ]
      secretName: ceph-rgw-tls

cephFilesystems: []
