ollama:
  enabled: false

pipelines:
  enabled: false

openaiBaseApiUrl: http://llama-server.llm.svc.cluster.local:9931/v1

persistence:
  enabled: true
  size: 10Gi
  storageClass: general

ingress:
  enabled: true
  host: "chat.{{ .Values.ingress.baseDomain }}"
  class: traefik
  annotations:
    cert-manager.io/cluster-issuer: "{{ .Values.ingress.clusterIssuer.internal }}"
  tls: true
  existingSecret: open-webui-tls
